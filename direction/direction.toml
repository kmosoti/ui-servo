# The reference signal of the ui-servo control loop.
#
# Every gate, probe and critic compares observed UI against THIS file. It is
# versioned so that a change of taste is a change of contract (auditable),
# never an argument in a prompt. Parsed by ui_servo.domain.contract.
#
# v2 — the ember-terminal-mono revision. Derived from the owner's stitched
# experiment (experiments/stitched-portfolio.html): cool near-black ground,
# monospace as the single voice, molten ember primary, amber counterweight,
# and a critical red the deep-dive fail states needed a word for. The hex
# values in the experiment were converted to oklch losslessly; the experiment's
# ad-hoc durations were NOT admitted — motion stays on the v1 table and
# artefacts quantise onto it.

[meta]
version = 2
name = "ember-terminal"
revision = "2026-08-08"
owner = "kmosoti"
description = "Terminal-mono portfolio: cool near-black ground, one monospace voice at a compact reading size, molten ember primary with an amber counterweight and a reserved critical red. Reads like a well-kept ops console — dense, quiet, evidence-first — never a product landing page."

[palette]
space = "oklch"

# #0a0b0d — the experiment's page ground.
[palette.background]
l = 0.149
c = 0.005
h = 264.5

# #141619 — the experiment's elevated panel ground.
[palette.surface]
l = 0.199
c = 0.007
h = 258.4

# #eae5db — warm off-white; the one warm neutral against the cool ground.
[palette.text]
l = 0.923
c = 0.014
h = 84.6

# #8b9096
[palette.muted]
l = 0.651
c = 0.011
h = 252.9

# #262a2f
[palette.border]
l = 0.283
c = 0.011
h = 254.0

# #ff7a45 — the ember. The only colour allowed to ask for attention.
[palette.accent]
l = 0.727
c = 0.176
h = 41.2

# #f2b134 — amber. Warning states, status badges, the second voice.
[palette.accent-2]
l = 0.802
c = 0.151
h = 78.9

# #ef4759 — critical red. Fail states in the flow simulators and nothing else;
# a page with no failures on it shows no red.
[palette.critical]
l = 0.643
c = 0.203
h = 19.2

[type]
ratio = 1.25
base_px = 14.5
rem_base_px = 16.0

# One voice: the display face IS the mono face. Hierarchy comes from scale,
# weight and the ember — not from a second family.
[type.display_family]
name = "JetBrains Mono"
fallbacks = ["Fira Code", "IBM Plex Mono", "ui-monospace", "SFMono-Regular", "Menlo", "Consolas", "monospace"]

[type.text_family]
name = "JetBrains Mono"
fallbacks = ["Fira Code", "IBM Plex Mono", "ui-monospace", "SFMono-Regular", "Menlo", "Consolas", "monospace"]

[type.mono_family]
name = "JetBrains Mono"
fallbacks = ["Fira Code", "IBM Plex Mono", "ui-monospace", "SFMono-Regular", "Menlo", "Consolas", "monospace"]

[type.steps]
xs = -2
sm = -1
base = 0
md = 1
lg = 2
xl = 3
2xl = 4
3xl = 5
display = 6

[spacing]
base_px = 8.0
ratio = 1.5

[spacing.steps]
xs = -2
sm = -1
base = 0
md = 1
lg = 2
xl = 3
2xl = 4
3xl = 5

[motion]
animatable_properties = ["transform", "opacity"]
reduced_motion_required = true

# Unchanged from v1 on purpose. The stitched experiment used 200/250/300/350/
# 400/420ms and a hand-typed cubic-bezier; those exact milliseconds were never
# the design, and admitting them would make the table a transcript instead of
# a constraint. Builders quantise: log-line entrances to `slow`, token travel
# to `deliberate`. Height/colour transitions in the experiment are not admitted
# at all — disclosures re-layout instantly and reveal content with
# opacity/transform; state-colour changes snap.
[motion.durations_ms]
quick = 90
base = 140
slow = 220
deliberate = 320

# Easings are cubic-bezier() with both x control points inside 0..1, or the bare
# keyword "linear" — the only keyword this contract admits. "linear" is allowed on
# purpose: it is what the browser reports for an unshaped transition, so the Tier 1
# probe needs it expressible here to compare getAnimations() output against. The
# named curves (ease, ease-in, ease-in-out) stay out: their shapes are unstated,
# and the motion axis is only checkable because every curve here is a number.
[motion.easings]
standard = "cubic-bezier(0.2, 0, 0, 1)"
entrance = "cubic-bezier(0.16, 1, 0.3, 1)"
exit = "cubic-bezier(0.4, 0, 1, 1)"

# Quality-diversity axes. The explorer samples within these bounds; anything
# outside them is off-contract by construction, so the QD grid cannot drift
# into generic density while still scoring well.
[density.space-multiplier]
min = 0.85
max = 1.25
default = 1.0
unit = ""

[density.measure]
min = 54.0
max = 78.0
default = 68.0
unit = "ch"

[density.line-height]
min = 1.3
max = 1.75
default = 1.55
unit = ""

# The bar is concrete: named artefacts a critic can be pointed at, not adjectives.
[[references]]
name = "linear.app"
url = "https://linear.app"
note = "Precision: optical alignment, restrained motion tokens, dense but never cramped."
axes = ["density", "motion"]

[[references]]
name = "rauno.me"
url = "https://rauno.me"
note = "Restraint: one idea per screen, motion used only to explain state changes."
axes = ["motion", "hierarchy"]

[[references]]
name = "brutalist-type"
url = "https://brutalistwebsites.com"
note = "Type as structure: the scale and weight of a single face carry the hierarchy instead of boxes and shadows."
axes = ["type", "hierarchy"]

[[references]]
name = "terminal-editorial"
url = "https://www.are.na"
note = "Editorial rhythm at a compact size: generous measure, real paragraph rhythm, links that read as prose — the console aesthetic must still read like a page."
axes = ["type", "density"]

[[anti_references]]
name = "default-shadcn"
url = "https://ui.shadcn.com"
note = "Unmodified default theme: neutral greys, 0.5rem radii everywhere, zinc-on-zinc cards. The corpus median."
axes = ["color", "density"]

[[anti_references]]
name = "bootstrap-default"
url = "https://getbootstrap.com"
note = "Primary-blue buttons, 1rem gutters, jumbotron hierarchy."
axes = ["color", "hierarchy"]

[[anti_references]]
name = "stock-saas-landing"
url = "https://www.saaslandingpage.com"
note = "Centred hero, gradient blob, three feature cards with lucide icons, logo cloud, pricing table."
axes = ["hierarchy", "density"]

[[anti_references]]
name = "ai-purple-gradient"
url = "https://vercel.com/templates"
note = "Violet-to-cyan gradient text, glassmorphic cards, glow on every border. Default-model taste."
axes = ["color", "motion"]

[[anti_references]]
name = "hacker-theatre"
url = "https://hackertyper.net"
note = "Terminal as costume: green-on-black matrix rain, fake scanlines, ASCII borders around everything, blinking everywhere. The console aesthetic collapses into cosplay the moment motion or ornament stops carrying information."
axes = ["motion", "hierarchy"]
