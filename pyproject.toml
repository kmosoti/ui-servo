[project]
name = "ui-servo"
version = "0.1.0"
description = "Tiered feedback loop for agent-generated UI: deterministic gates for correctness, cross-family model panel for critique, quality-diversity sampling for taste"
requires-python = ">=3.14"
dependencies = [
    "litestar>=2.24",      # Tier 1 beacon ingest + evidence API
    "granian>=2.8",        # Rust (hyper) ASGI server — serves the above, in tests and on a droplet
    "nh3>=0.2",            # Rust (ammonia) HTML sanitizer — Tier 0
    "orjson>=3.10",        # Rust JSON — evidence store + beacon ingest
    "pydantic>=2.9",       # pydantic-core is Rust; the only third-party dep the domain may use
    "httpx>=0.27",         # evidence API client; probe/harness plumbing
    "anthropic>=0.40",     # unused by default; reserved for a future API-mode judge (panel uses local CLIs)
    "playwright>=1.49",    # Tier 2 shadow-browser harness
    "pillow>=11.0",        # pixel diff (C-backed)
    "tinycss2>=1.4",       # CSS token parsing for class allowlist build
]

[dependency-groups]
# pyyaml is used directly by tests/test_gauntlet_skill.py; it must not be relied
# on as a transitive dependency of litestar.
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "live: exercises the locally-authenticated model CLIs",
    "playwright: drives a real headless browser",
]
filterwarnings = [
    # starlette.testclient warns on every import once httpx.Client no longer
    # matches its expected shape; fastapi.testclient re-exports it, so it fires
    # on collection of every test module that imports TestClient. Scoped to the
    # exact category + message so it goes silent (rather than masking something
    # else) the day this dependency pair moves on or fastapi is dropped.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Explicit `select`, not `extend-select`: this ruff's actual zero-config
# default is not the classic E4/E7/E9/F -- it is ~400 rules spanning most
# plugins (verified with `ruff check --show-settings` against an empty
# config). `extend-select` builds on top of that default, so using it here
# would silently adopt the whole default set alongside these ten categories.
# `select` replaces the default outright, which is what a deliberately
# narrow adoption needs.
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "BLE", "RUF100"]

[tool.ruff.lint.isort]
# Without this, isort splits a `from x import a, b as c` into two import
# statements just because one name is aliased -- every future --fix on a
# mixed plain/aliased import re-splits it the same way.
combine-as-imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ui_servo"]

# One authored contract, two locations: the checkout keeps direction/direction.toml,
# the wheel gets a copy on the import path so the CLI has a default when there is no
# source tree. Copied at build time, so the two cannot drift. probe.js rides along for
# the same reason: the preview server serves it to every page it renders, and a wheel
# that promises a <script src> it cannot serve is a wheel that silently loses evidence.
[tool.hatch.build.targets.wheel.force-include]
"direction/direction.toml" = "ui_servo/domain/data/direction.toml"
"probe/probe.js" = "ui_servo/adapters/data/probe.js"

[tool.hatch.build.targets.sdist]
include = [
    "ui_servo",
    "direction",
    "probe",  # force-included into the wheel; a wheel cannot be built from an sdist without it
    "tests",
    "README.md",
    "ARCHITECTURE.md",
    "pyproject.toml",
]
