[package]
name = "ui-servo-site"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "The product skeleton the ui-servo control loop steers: SSR pages, htmx fragments, sensor-ready markup."
publish = false
# Two binaries, so a bare `cargo run` would otherwise be an error. The server is
# what `cargo run` has always meant here, and what site/README.md and tools/specs
# tell people to type; the exporter is opt-in via `--bin export`.
default-run = "ui-servo-site"

# U7 grows a wasm island crate at site/islands/. Excluding it here keeps that
# crate independently buildable by wasm-pack without dragging a wasm target
# into this package's dependency graph.
[workspace]
members = ["."]
exclude = ["islands"]

# The site is a library with two binaries over it. The library is not a
# convenience: `export` renders the static site by calling the same maud page
# functions the server calls, through the same route manifest, and the only way
# for two binaries to share those is for them to live in neither.
[lib]
name = "ui_servo_site"
path = "src/lib.rs"

# Named explicitly because tests/test_island.py launches
# `site/target/debug/ui-servo-site` directly rather than through `cargo run`.
[[bin]]
name = "ui-servo-site"
path = "src/main.rs"

[[bin]]
name = "export"
path = "src/bin/export.rs"

[dependencies]
axum = "0.8"
maud = { version = "0.27", features = ["axum"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Router::oneshot — exercise the real routing table without binding a socket.
tower = { version = "0.5", features = ["util"] }

[profile.dev]
debug = 1

# Thin LTO, not fat: this is a small crate with a shallow dependency graph, so
# fat LTO's whole-program optimization has little left to find here — it would
# mostly just slow down release builds for a binary-size win close to zero.
# Thin gets nearly all of the benefit (cross-codegen-unit inlining) in a
# fraction of the time.
[profile.release]
lto = "thin"
# "debuginfo", not `true`: this binary runs as a long-lived server on a
# droplet, not a download artifact, so binary size barely matters but a
# readable backtrace from a live panic does — stripping everything would
# turn `tracing`'s panic log into bare addresses and turn "read the log"
# into "rebuild and reproduce."
strip = "debuginfo"
